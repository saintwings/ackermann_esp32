[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
lib_deps =
  4-20ma/ModbusMaster@^2.0.1
  adafruit/Adafruit NeoPixel@^1.12.0
  adafruit/Adafruit BNO08x@^1.2.5
  links2004/WebSockets@^2.6.1
  bblanchon/ArduinoJson@^7.0.4

; Optional: if using PS2X library, add it here or vendor it into lib/
;  madsci1016/PS2X_lib @ ^1.0.0

; Set your CAN pins if not default via build flags (adjust in code if needed)
; build_flags = -D TWAI_TX_PIN=5 -D TWAI_RX_PIN=4
