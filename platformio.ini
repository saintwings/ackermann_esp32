[platformio]
; IDE Upload button / plain `pio run -t upload`: USB only. WiFi: -e esp32-s3-ota.
default_envs = esp32-s3

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D TINY_GSM_MODEM_SIM7600
lib_deps =
  4-20ma/ModbusMaster@^2.0.1
  adafruit/Adafruit NeoPixel@^1.12.0
  adafruit/Adafruit BNO08x@^1.2.5
  links2004/WebSockets@^2.6.1
  bblanchon/ArduinoJson@^7.0.4
  vshymanskyy/TinyGSM@^0.11.7

; WiFi upload (ArduinoOTA): pio run -e esp32-s3-ota -t upload
; upload_port = the robot's WIFI_STATIC_IP (leafsheep .42, ladybug .41);
; --auth = its OTA_PASSWORD (include/Config_<robot>.h). Same build as esp32-s3.
; Another robot: pio run -e esp32-s3-ota -t upload --upload-port 192.168.1.41 (and its --auth)
; A serial --upload-port (IDE status-bar port) is replaced by custom_ota_host.
[env:esp32-s3-ota]
extends = env:esp32-s3
upload_protocol = espota
custom_ota_host = 192.168.1.42
upload_port = 192.168.1.42
extra_scripts = pre:tools/ota_upload_port.py
upload_flags =
  --port=3232
  --auth=leafsheep-ota

; Field upload through the robot's own hotspot (no farm WiFi for 30 s): join WiFi
; "leafsheep" (password leafsheep001), then: pio run -e esp32-s3-ota-ap -t upload
[env:esp32-s3-ota-ap]
extends = env:esp32-s3-ota
custom_ota_host = 192.168.4.1
upload_port = 192.168.4.1

; Optional: if using PS2X library, add it here or vendor it into lib/
;  madsci1016/PS2X_lib @ ^1.0.0

; Set your CAN pins if not default via build flags (adjust in code if needed)
; build_flags = -D TWAI_TX_PIN=5 -D TWAI_RX_PIN=4
