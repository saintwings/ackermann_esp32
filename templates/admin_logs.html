<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robot Logs — Admin</title>
  <script>
    // Google Maps bootstrap loader (same key as mission_planner_v2.html)
    (g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.googleapis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({
      key: "AIzaSyA21u1FcRnpyDpn8lECbJi2vnpWpseYDac",
      v: "weekly"
    });
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }
    body {
      background: #0f1117;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid #2d3148;
    }
    header h1 { font-size: 18px; font-weight: 700; }
    header a { font-size: 13px; color: #64748b; text-decoration: none; }
    header a:hover { color: #94a3b8; }

    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: 300px 1fr 280px;
      min-height: 0;
    }
    @media (max-width: 1100px) {
      .layout { grid-template-columns: 1fr; }
      #map { min-height: 420px; }
    }

    aside {
      background: #1a1d27;
      border-right: 1px solid #2d3148;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 0;
    }
    aside.right { border-right: none; border-left: 1px solid #2d3148; }

    h2 {
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    label { display: block; font-size: 12px; color: #64748b; margin: 8px 0 4px; }
    select, input {
      width: 100%;
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 6px;
      color: #e2e8f0;
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
    }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }

    button {
      background: #3b82f6;
      border: none;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 14px;
      white-space: nowrap;
    }
    button:hover { background: #2563eb; }
    button:disabled { background: #334155; color: #64748b; cursor: default; }
    button.ghost { background: #1e2236; border: 1px solid #2d3148; color: #cbd5e1; }
    button.ghost:hover { background: #262b45; }

    .muted { color: #64748b; font-size: 12px; }
    .downloads a { color: #60a5fa; font-size: 12px; margin-right: 12px; text-decoration: none; }
    .downloads a:hover { text-decoration: underline; }

    #events { list-style: none; font-size: 12px; }
    #events li {
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      border-bottom: 1px solid #1e2236;
    }
    #events li:hover { background: #1e2236; }
    #events .ev-time { color: #64748b; font-variant-numeric: tabular-nums; }
    #events .ev-name { font-weight: 600; margin-left: 6px; }
    #events .ev-detail { color: #94a3b8; display: block; word-break: break-word; }
    .ev-CONNECT { color: #4ade80; }
    .ev-DISCONNECT, .ev-TIMEOUT { color: #f87171; }
    .ev-CMD_ACK { color: #60a5fa; }

    main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
    #map { flex: 1; min-height: 0; background: #111; }

    .player {
      border-top: 1px solid #2d3148;
      background: #1a1d27;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .player-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .player-controls select { width: auto; }
    .player-controls label { display: inline-flex; align-items: center; gap: 4px; margin: 0; }
    .player-controls input[type=checkbox] { width: auto; }
    #clock { font-variant-numeric: tabular-nums; font-size: 14px; margin-left: auto; }
    #scrub { width: 100%; padding: 0; accent-color: #3b82f6; }
    #chart { width: 100%; height: 70px; display: block; cursor: crosshair; }

    .kv { width: 100%; border-collapse: collapse; font-size: 12px; }
    .kv td { padding: 4px 6px; border-bottom: 1px solid #1e2236; vertical-align: top; }
    .kv td:first-child { color: #64748b; white-space: nowrap; }
    .kv td:last-child { text-align: right; font-variant-numeric: tabular-nums; word-break: break-all; }
    .kv tr.group td { color: #94a3b8; font-weight: 600; padding-top: 10px; }

    #toast {
      position: fixed;
      bottom: 24px; right: 24px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 13px;
      display: none;
      z-index: 2000;
    }
    #toast.show { display: block; }
  </style>
</head>
<body>

<header>
  <h1>📼 Robot Logs &amp; Replay</h1>
  <div style="display:flex;gap:16px;align-items:center">
    <a href="/admin">← Admin Panel</a>
    <a href="/">Mission Planner</a>
    <a href="/logout">Log out</a>
  </div>
</header>

<div class="layout">

  <!-- ── Left: log selection + comm events ─────────────────────────────── -->
  <aside>
    <div>
      <h2>Select Log</h2>
      <label for="sel-robot">Robot</label>
      <select id="sel-robot"></select>
      <label for="sel-date">Day</label>
      <select id="sel-date"></select>
      <div class="row">
        <div>
          <label for="t-start">From (local)</label>
          <input id="t-start" type="time" step="1">
        </div>
        <div>
          <label for="t-end">To (local)</label>
          <input id="t-end" type="time" step="1">
        </div>
      </div>
      <div style="margin-top:12px; display:flex; gap:8px; align-items:center">
        <button id="btn-load" onclick="loadLog()">Load</button>
        <span id="load-info" class="muted"></span>
      </div>
      <label title="Hide samples with impossible GPS fields (fix_quality outside 1–8, lat/lon 0, bad sats/HDOP) or position jumps faster than 15 m/s — usually corrupted NMEA sentences"
             style="display:flex; align-items:center; gap:6px; margin-top:12px; color:#cbd5e1">
        <input type="checkbox" id="chk-gps-filter" checked style="width:auto"> Filter GPS glitches
      </label>
      <div id="gps-filter-info" class="muted" style="margin-top:4px"></div>
      <div class="downloads" id="downloads" style="margin-top:10px"></div>
    </div>

    <div style="flex:1; min-height:0">
      <h2>Communication Events</h2>
      <ul id="events"><li class="muted">Load a log to see events</li></ul>
    </div>
  </aside>

  <!-- ── Center: map + player ──────────────────────────────────────────── -->
  <main>
    <div id="map"></div>
    <div class="player">
      <div class="player-controls">
        <button class="ghost" onclick="stepBy(-1)" title="Previous sample">⏮</button>
        <button id="btn-play" onclick="togglePlay()" disabled>▶ Play</button>
        <button class="ghost" onclick="stepBy(1)" title="Next sample">⏭</button>
        <select id="sel-speed" title="Playback speed">
          <option value="1">1×</option>
          <option value="2">2×</option>
          <option value="5">5×</option>
          <option value="10" selected>10×</option>
          <option value="30">30×</option>
          <option value="60">60×</option>
          <option value="300">300×</option>
        </select>
        <label title="Jump over periods with no telemetry (robot offline)">
          <input type="checkbox" id="chk-skip" checked> skip gaps
        </label>
        <label title="Keep the robot centered on the map">
          <input type="checkbox" id="chk-follow" checked> follow
        </label>
        <span id="clock" class="muted">--:--:--</span>
      </div>
      <input id="scrub" type="range" min="0" max="0" value="0" step="1">
      <canvas id="chart"></canvas>
    </div>
  </main>

  <!-- ── Right: current sample values ──────────────────────────────────── -->
  <aside class="right">
    <div>
      <h2>Sample <span id="sample-idx" class="muted"></span></h2>
      <table class="kv" id="sample"><tr><td class="muted">No data</td><td></td></tr></table>
    </div>
  </aside>

</div>

<div id="toast"></div>

<script>
  // ── State ──────────────────────────────────────────────────────────────
  const GAP_MS = 5000;            // gap between samples treated as "robot offline"
  let logIndex = {};              // robot_id -> [{date, telemetry_bytes, comm_bytes}]
  let rows = [];                  // telemetry samples [{ts, payload}]
  let times = [];                 // epoch ms per row
  let events = [];                // comm events [{ts, event, detail}]
  let cur = 0;                    // current row index
  let playing = false;
  let playClock = 0;              // virtual replay time (epoch ms)
  let lastFrame = 0;

  // ── Map ────────────────────────────────────────────────────────────────
  let map = null, fullTrack = null, doneTrack = null, robotMarker = null;
  let trackPts = [];              // [{lat, lng}] of every row with a GPS fix

  // Navigation-arrow symbol; rotation = heading (deg, clockwise from north)
  function robotSymbol(heading) {
    return {
      path: 'M 0,-12 L 8,8 L 0,3 L -8,8 Z',
      fillColor: '#3b82f6',
      fillOpacity: 1,
      strokeColor: '#fff',
      strokeWeight: 2,
      scale: 1.1,
      rotation: heading,
    };
  }

  async function initMap() {
    const { Map } = await google.maps.importLibrary('maps');
    await google.maps.importLibrary('marker');
    map = new Map(document.getElementById('map'), {
      center: { lat: 13.75, lng: 100.5 },
      zoom: 5,
      mapTypeId: 'hybrid',
      mapTypeControl: true,
      mapTypeControlOptions: {
        style: google.maps.MapTypeControlStyle.HORIZONTAL_BAR,
        position: google.maps.ControlPosition.TOP_RIGHT,
        mapTypeIds: ['roadmap', 'satellite', 'hybrid', 'terrain'],
      },
      streetViewControl: false,
      fullscreenControl: true,
      tilt: 0,
    });
    fullTrack = new google.maps.Polyline({ map, strokeColor: '#64748b', strokeWeight: 3, strokeOpacity: 0.8 });
    doneTrack = new google.maps.Polyline({ map, strokeColor: '#facc15', strokeWeight: 4, zIndex: 1 });
    robotMarker = new google.maps.Marker({ clickable: false, zIndex: 1000, icon: robotSymbol(0) });
  }

  const mapReady = initMap().catch(e => {
    console.error('Google Maps failed to load:', e);
    toast('Google Maps failed to load — replay will run without the map');
  });

  // True when ll lies inside the visible map shrunk by `inset` (fraction) on each side
  function inInnerBounds(ll, inset) {
    const b = map.getBounds();
    if (!b) return true;
    const ne = b.getNorthEast(), sw = b.getSouthWest();
    const dLat = (ne.lat() - sw.lat()) * inset, dLng = (ne.lng() - sw.lng()) * inset;
    return ll.lat > sw.lat() + dLat && ll.lat < ne.lat() - dLat
        && ll.lng > sw.lng() + dLng && ll.lng < ne.lng() - dLng;
  }

  // Index of the last row with a usable GPS fix at or before each row (−1 if none)
  let fixIdx = [];
  // Map from row index -> position in the track polyline (for the "done" portion)
  let trackPos = [];
  // Per row: why the GPS glitch filter dropped its fix ('' = kept / not filtered)
  let rejectReason = [];
  const MAX_GPS_SPEED = 15;       // m/s; faster apparent motion between fixes is a glitch

  function hasFix(p) {
    const g = (p && p.gps) || {};
    return g.valid && Number.isFinite(g.latitude) && Number.isFinite(g.longitude)
        && Math.abs(g.latitude) <= 90 && Math.abs(g.longitude) <= 180
        && !(g.latitude === 0 && g.longitude === 0);
  }

  // Fields that can't come from a real GGA fix — the signature of a spliced/corrupted sentence
  function gpsFieldIssue(g) {
    if (!Number.isInteger(g.fix_quality) || g.fix_quality < 1 || g.fix_quality > 8) return `fix_quality ${g.fix_quality}`;
    if (!(g.satellites > 0 && g.satellites <= 64)) return `satellites ${g.satellites}`;
    if (!(g.hdop > 0 && g.hdop < 50)) return `hdop ${g.hdop}`;
    if (g.latitude === 0 || g.longitude === 0) return 'lat/lon is 0';
    return '';
  }

  function distM(a, b) {
    const kx = 111320 * Math.cos(a.lat * Math.PI / 180);
    return Math.hypot((b.lat - a.lat) * 111320, (b.lng - a.lng) * kx);
  }

  // ── Helpers ────────────────────────────────────────────────────────────
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 3000);
  }

  function fmtBytes(n) {
    if (n < 1024) return `${n} B`;
    if (n < 1048576) return `${(n / 1024).toFixed(1)} KB`;
    return `${(n / 1048576).toFixed(1)} MB`;
  }

  function fmtDate(d) { return `${d.slice(0, 4)}-${d.slice(4, 6)}-${d.slice(6, 8)}`; }

  function fmtTime(ms) {
    return new Date(ms).toLocaleTimeString([], { hour12: false }) +
      '.' + String(new Date(ms).getMilliseconds()).padStart(3, '0').slice(0, 1);
  }

  // Largest index i with times[i] <= t
  function indexAt(t) {
    let lo = 0, hi = times.length - 1;
    if (hi < 0 || t < times[0]) return 0;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (times[mid] <= t) lo = mid; else hi = mid - 1;
    }
    return lo;
  }

  // ── Log list ───────────────────────────────────────────────────────────
  async function loadIndex() {
    const res = await fetch('/api/admin/logs');
    if (!res.ok) { toast('Not authorized'); return; }
    logIndex = await res.json();

    const selRobot = document.getElementById('sel-robot');
    selRobot.innerHTML = '';
    const ids = Object.keys(logIndex);
    if (!ids.length) {
      selRobot.innerHTML = '<option value="">— no logs yet —</option>';
      document.getElementById('btn-load').disabled = true;
    }
    ids.forEach(id => selRobot.add(new Option(id, id)));
    fillDates();
  }

  function fillDates() {
    const robotId = document.getElementById('sel-robot').value;
    const selDate = document.getElementById('sel-date');
    selDate.innerHTML = '';
    (logIndex[robotId] || []).forEach(d => {
      selDate.add(new Option(
        `${fmtDate(d.date)}  ·  ${fmtBytes(d.telemetry_bytes)}`, d.date));
    });
    updateDownloads();
  }

  function updateDownloads() {
    const robotId = document.getElementById('sel-robot').value;
    const date = document.getElementById('sel-date').value;
    const day = (logIndex[robotId] || []).find(d => d.date === date);
    const el = document.getElementById('downloads');
    el.innerHTML = '';
    if (!day) return;
    const base = `/api/admin/logs/${encodeURIComponent(robotId)}/${date}`;
    if (day.telemetry_bytes) {
      const a = document.createElement('a');
      a.href = `${base}/telemetry/download`;
      a.textContent = `⬇ telemetry.jsonl (${fmtBytes(day.telemetry_bytes)})`;
      el.appendChild(a);
    }
    if (day.comm_bytes) {
      const a = document.createElement('a');
      a.href = `${base}/comm/download`;
      a.textContent = `⬇ comm.log (${fmtBytes(day.comm_bytes)})`;
      el.appendChild(a);
    }
  }

  document.getElementById('sel-robot').addEventListener('change', fillDates);
  document.getElementById('sel-date').addEventListener('change', updateDownloads);

  // Local HH:MM[:SS] on the selected day -> UTC ISO string matching the log ts format
  function localToIso(date, hhmmss) {
    if (!hhmmss) return '';
    const [h, m, s] = hhmmss.split(':').map(Number);
    const d = new Date(+date.slice(0, 4), +date.slice(4, 6) - 1, +date.slice(6, 8), h, m, s || 0);
    return d.toISOString();
  }

  // ── Load one robot/day ─────────────────────────────────────────────────
  async function loadLog() {
    const robotId = document.getElementById('sel-robot').value;
    const date = document.getElementById('sel-date').value;
    if (!robotId || !date) return;

    pause();
    await mapReady;
    const btn = document.getElementById('btn-load');
    const info = document.getElementById('load-info');
    btn.disabled = true;
    info.textContent = 'Loading…';

    const params = new URLSearchParams();
    const start = localToIso(date, document.getElementById('t-start').value);
    const end = localToIso(date, document.getElementById('t-end').value);
    if (start) params.set('start', start);
    if (end) params.set('end', end);

    const base = `/api/admin/logs/${encodeURIComponent(robotId)}/${date}`;
    try {
      const day = (logIndex[robotId] || []).find(d => d.date === date) || {};
      const [tRes, cRes] = await Promise.all([
        day.telemetry_bytes ? fetch(`${base}/telemetry?${params}`) : null,
        day.comm_bytes ? fetch(`${base}/comm`) : null,
      ]);
      const tData = tRes && tRes.ok ? await tRes.json() : { rows: [], total: 0, returned: 0 };
      const cData = cRes && cRes.ok ? await cRes.json() : { events: [] };

      rows = tData.rows;
      times = rows.map(r => Date.parse(r.ts));
      events = cData.events.filter(e =>
        (!start || e.ts >= start) && (!end || e.ts <= end));

      info.textContent = tData.total > tData.returned
        ? `${tData.returned.toLocaleString()} of ${tData.total.toLocaleString()} samples (downsampled)`
        : `${tData.total.toLocaleString()} samples`;
    } catch (e) {
      info.textContent = '';
      toast(`Load failed: ${e}`);
      rows = []; times = []; events = [];
    }
    btn.disabled = false;

    buildTrack();
    renderEvents();
    const scrub = document.getElementById('scrub');
    scrub.max = Math.max(0, rows.length - 1);
    document.getElementById('btn-play').disabled = rows.length === 0;
    seek(0, true);
    drawChart();
  }

  function buildTrack(fit = true) {
    const filter = document.getElementById('chk-gps-filter').checked;
    trackPts = [];
    fixIdx = new Array(rows.length);
    trackPos = new Array(rows.length);
    rejectReason = new Array(rows.length).fill('');
    let last = -1, glitches = 0, lastAcc = null, jumpRun = 0;
    rows.forEach((r, i) => {
      let ok = hasFix(r.payload);
      if (ok && filter) {
        const g = r.payload.gps;
        let why = gpsFieldIssue(g);
        if (!why && lastAcc) {
          const d = distM(lastAcc, { lat: g.latitude, lng: g.longitude });
          const dt = Math.max(0.5, (times[i] - lastAcc.t) / 1000);
          // After 5 rejected jumps in a row, trust the new position (robot really moved)
          if (d > 5 && d / dt > MAX_GPS_SPEED && jumpRun < 5) { why = `jump ${d.toFixed(0)} m`; jumpRun++; }
        }
        if (why) { ok = false; rejectReason[i] = why; glitches++; }
      }
      if (ok) {
        const p = { lat: r.payload.gps.latitude, lng: r.payload.gps.longitude };
        trackPts.push(p);
        lastAcc = { ...p, t: times[i] };
        jumpRun = 0;
        last = i;
      }
      fixIdx[i] = last;
      trackPos[i] = trackPts.length;
    });
    document.getElementById('gps-filter-info').textContent = !filter || !rows.length ? ''
      : glitches ? `${glitches} GPS glitch${glitches > 1 ? 'es' : ''} hidden` : 'No GPS glitches found';
    if (rows.length && !trackPts.length) toast('No valid GPS fix in this range — map track unavailable');
    if (!map) return;
    fullTrack.setPath(trackPts);
    doneTrack.setPath([]);
    if (trackPts.length) {
      if (fit) {
        const bounds = new google.maps.LatLngBounds();
        trackPts.forEach(p => bounds.extend(p));
        map.fitBounds(bounds, 30);
        // fitBounds has no maxZoom option; cap it so a tiny track doesn't zoom past imagery
        google.maps.event.addListenerOnce(map, 'idle', () => { if (map.getZoom() > 20) map.setZoom(20); });
      }
      robotMarker.setMap(map);
    } else {
      robotMarker.setMap(null);
    }
  }

  function renderEvents() {
    const ul = document.getElementById('events');
    ul.innerHTML = '';
    if (!events.length) {
      ul.innerHTML = '<li class="muted">No events in this range</li>';
      return;
    }
    events.forEach(ev => {
      const li = document.createElement('li');
      const t = document.createElement('span');
      t.className = 'ev-time';
      t.textContent = new Date(ev.ts).toLocaleTimeString([], { hour12: false });
      const n = document.createElement('span');
      n.className = `ev-name ev-${ev.event}`;
      n.textContent = ev.event;
      li.append(t, n);
      if (ev.detail) {
        const d = document.createElement('span');
        d.className = 'ev-detail';
        d.textContent = ev.detail;
        li.appendChild(d);
      }
      li.title = 'Jump replay to this time';
      li.onclick = () => { if (rows.length) seek(indexAt(Date.parse(ev.ts)), true); };
      ul.appendChild(li);
    });
  }

  // ── Playback ───────────────────────────────────────────────────────────
  function seek(i, resetClock) {
    if (!rows.length) {
      document.getElementById('clock').textContent = '--:--:--';
      renderSample(null);
      return;
    }
    cur = Math.max(0, Math.min(rows.length - 1, i));
    if (resetClock) playClock = times[cur];
    document.getElementById('scrub').value = cur;
    document.getElementById('clock').textContent =
      `${fmtTime(times[cur])}  /  ${fmtTime(times[times.length - 1])}`;
    document.getElementById('sample-idx').textContent = `#${cur + 1} / ${rows.length}`;

    const f = fixIdx[cur];
    if (map && f >= 0) {
      const g = rows[f].payload.gps;
      const ll = { lat: g.latitude, lng: g.longitude };
      const heading = Number((rows[cur].payload.status || {}).heading) || 0;
      robotMarker.setPosition(ll);
      robotMarker.setIcon(robotSymbol(heading));
      doneTrack.setPath(trackPts.slice(0, trackPos[cur]));
      if (document.getElementById('chk-follow').checked && !inInnerBounds(ll, 0.2)) {
        map.setCenter(ll);
      }
    }
    renderSample(rows[cur]);
    drawChart();
  }

  function stepBy(d) { pause(); seek(cur + d, true); }

  function togglePlay() { playing ? pause() : play(); }

  function play() {
    if (!rows.length) return;
    if (cur >= rows.length - 1) seek(0, true);
    playing = true;
    lastFrame = performance.now();
    document.getElementById('btn-play').textContent = '⏸ Pause';
    requestAnimationFrame(tick);
  }

  function pause() {
    playing = false;
    document.getElementById('btn-play').textContent = '▶ Play';
  }

  function tick(now) {
    if (!playing) return;
    const speed = Number(document.getElementById('sel-speed').value);
    playClock += (now - lastFrame) * speed;
    lastFrame = now;

    // Jump over offline gaps instead of replaying dead air
    if (document.getElementById('chk-skip').checked && cur + 1 < rows.length
        && times[cur + 1] - times[cur] > GAP_MS && playClock > times[cur] + GAP_MS) {
      playClock = times[cur + 1];
    }

    const i = indexAt(playClock);
    if (i !== cur) seek(i, false);
    if (cur >= rows.length - 1) { pause(); return; }
    requestAnimationFrame(tick);
  }

  document.getElementById('chk-gps-filter').addEventListener('change', () => {
    if (!rows.length) return;
    buildTrack(false);
    seek(cur, true);
  });

  document.getElementById('scrub').addEventListener('input', e => seek(Number(e.target.value), true));

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    else if (e.code === 'ArrowRight') stepBy(e.shiftKey ? 50 : 1);
    else if (e.code === 'ArrowLeft') stepBy(e.shiftKey ? -50 : -1);
  });

  // ── Current sample panel ───────────────────────────────────────────────
  function renderSample(row) {
    const tbl = document.getElementById('sample');
    tbl.innerHTML = '';
    if (!row) {
      tbl.innerHTML = '<tr><td class="muted">No data</td><td></td></tr>';
      return;
    }
    const addRow = (k, v, cls) => {
      const tr = tbl.insertRow();
      if (cls) tr.className = cls;
      tr.insertCell().textContent = k;
      tr.insertCell().textContent = v;
    };
    addRow('time', new Date(row.ts).toLocaleString([], { hour12: false }));
    if (rejectReason[cur]) addRow('⚠ GPS filtered', rejectReason[cur], 'group');
    const walk = (obj, prefix) => {
      Object.entries(obj || {}).forEach(([k, v]) => {
        if (v && typeof v === 'object' && !Array.isArray(v)) {
          addRow(prefix + k, '', 'group');
          walk(v, '  ');
        } else {
          addRow(prefix + k, typeof v === 'number' && !Number.isInteger(v)
            ? (Math.abs(v) >= 1000 || Math.abs(v) < 0.01 ? v.toPrecision(10) : v.toFixed(3))
            : String(v));
        }
      });
    };
    walk(row.payload, '');
  }

  // ── Speed timeline (click to seek) ─────────────────────────────────────
  const chart = document.getElementById('chart');
  function drawChart() {
    const dpr = window.devicePixelRatio || 1;
    const w = chart.clientWidth, h = chart.clientHeight;
    chart.width = w * dpr; chart.height = h * dpr;
    const ctx = chart.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, w, h);
    if (!rows.length) return;

    const t0 = times[0], t1 = times[times.length - 1] || t0 + 1;
    const x = t => ((t - t0) / Math.max(1, t1 - t0)) * w;
    const speeds = rows.map(r => Number((r.payload.status || {}).speed) || 0);
    const vmax = Math.max(0.1, ...speeds.map(Math.abs));
    const y = v => h - 4 - (Math.abs(v) / vmax) * (h - 14);

    // Offline gaps
    ctx.fillStyle = 'rgba(239,68,68,0.12)';
    for (let i = 1; i < times.length; i++) {
      if (times[i] - times[i - 1] > GAP_MS) ctx.fillRect(x(times[i - 1]), 0, x(times[i]) - x(times[i - 1]), h);
    }
    // Comm events
    ctx.fillStyle = '#475569';
    events.forEach(ev => {
      const t = Date.parse(ev.ts);
      if (t >= t0 && t <= t1) ctx.fillRect(x(t), 0, 1, 6);
    });
    // Speed trace
    ctx.strokeStyle = '#60a5fa';
    ctx.lineWidth = 1;
    ctx.beginPath();
    rows.forEach((_, i) => {
      const px = x(times[i]), py = y(speeds[i]);
      if (i === 0 || times[i] - times[i - 1] > GAP_MS) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    });
    ctx.stroke();
    // Cursor
    ctx.fillStyle = '#facc15';
    ctx.fillRect(x(times[cur]) - 1, 0, 2, h);
    ctx.fillStyle = '#64748b';
    ctx.font = '10px sans-serif';
    ctx.fillText(`|speed| max ${vmax.toFixed(2)} m/s`, 4, 16);
  }

  chart.addEventListener('click', e => {
    if (!rows.length) return;
    const r = chart.getBoundingClientRect();
    const t0 = times[0], t1 = times[times.length - 1];
    seek(indexAt(t0 + ((e.clientX - r.left) / r.width) * (t1 - t0)), true);
  });
  window.addEventListener('resize', drawChart);

  // ── Init ───────────────────────────────────────────────────────────────
  loadIndex();
</script>
</body>
</html>
