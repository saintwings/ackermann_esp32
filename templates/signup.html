<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Robot Control</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1117;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e2e8f0;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 16px;
      padding: 40px 36px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo svg { width: 48px; height: 48px; }
    .logo h1 {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-top: 12px;
    }
    .logo p {
      font-size: 13px;
      color: #64748b;
      margin-top: 4px;
    }

    .form-group { margin-bottom: 18px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px 14px;
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #3b82f6; }

    .hint {
      font-size: 11px;
      color: #475569;
      margin-top: 4px;
    }

    .btn {
      width: 100%;
      padding: 11px;
      background: #3b82f6;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .btn:hover { background: #2563eb; }

    .error {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.35);
      border-radius: 8px;
      color: #f87171;
      font-size: 13px;
      padding: 10px 14px;
      margin-bottom: 18px;
    }

    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: #64748b;
    }
    .footer a { color: #3b82f6; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">

    <div class="logo">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="48" height="48" rx="12" fill="#1e3a5f"/>
        <rect x="14" y="20" width="20" height="14" rx="3" fill="#3b82f6"/>
        <rect x="18" y="16" width="12" height="6" rx="2" fill="#60a5fa"/>
        <circle cx="20" cy="27" r="2.5" fill="#0f1117"/>
        <circle cx="28" cy="27" r="2.5" fill="#0f1117"/>
        <rect x="21" y="30" width="6" height="2" rx="1" fill="#0f1117"/>
        <rect x="10" y="24" width="4" height="6" rx="2" fill="#3b82f6"/>
        <rect x="34" y="24" width="4" height="6" rx="2" fill="#3b82f6"/>
        <rect x="17" y="34" width="4" height="4" rx="1" fill="#2563eb"/>
        <rect x="27" y="34" width="4" height="4" rx="1" fill="#2563eb"/>
        <circle cx="24" cy="14" r="2" fill="#60a5fa"/>
        <line x1="24" y1="16" x2="24" y2="20" stroke="#60a5fa" stroke-width="1.5"/>
      </svg>
      <h1>Create Account</h1>
      <p>Robot Control — Mission Planner</p>
    </div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="yourname" required autofocus>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
        <div class="hint">Minimum 8 characters</div>
      </div>
      <div class="form-group">
        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" name="confirm" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn">Create Account</button>
    </form>

    <div class="footer">
      Already have an account? <a href="/login">Log in</a>
    </div>

  </div>
</body>
</html>
